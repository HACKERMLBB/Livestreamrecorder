services:
    - type: web
    name: livestream-recorder
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
            - key: BOT_TOKEN
        sync: false
            - key: CHANNEL_ID
        sync: false
            - key: MIXDROP_API_KEY
        sync: false
            - key: MIXDROP_EMAIL
        sync: false
